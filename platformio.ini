; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c3]
platform = espressif32 ; Espressif 32 (ESP32) platform
board = seeed_xiao_esp32c3 ; Seeed Xiao ESP32C3 board
board_build.filesystem = littlefs ; Use LittleFS file system
framework = arduino ; Arduino framework
monitor_speed = 115200 ; Serial monitor speed
lib_deps = ; Imported libraries
	madhephaestus/ESP32Servo@^3.0.9
	esp32async/AsyncTCP@^3.4.8
	esp32async/ESPAsyncWebServer@^3.8.1
